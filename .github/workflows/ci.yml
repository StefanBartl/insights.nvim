name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Pinned, not "latest": stylua's own rule changes between releases would
      # otherwise turn this gate red with no local diff to blame it on.
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin TESTS

  luacheck:
    name: luacheck (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Plain Lua 5.4, not LuaJIT: luacheck only needs *an* interpreter to run
      # on, and which dialect it lints for is set by `std` in .luacheckrc --
      # independent of the host. Pinning a LuaJIT build here buys nothing and
      # breaks when that exact tarball disappears upstream.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua plugin TESTS

  tests:
    name: tests (headless) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: insights.nvim

      # lib.nvim is a real runtime dependency -- several modules require it at
      # module load -- so the suite cannot run without it. Checked out as a
      # sibling, which is the layout scripts/test.sh resolves
      # (after $LIB_NVIM_DIR and .deps/).
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # ripgrep is this plugin's core dependency for symbol indexing and
      # import scanning (lua/insights/scan/rg.lua, symbols/rg_index.lua) --
      # not a test-only fixture, and not preinstalled on ubuntu-latest.
      # Without it, `vim.fn.executable("rg")`'s guard short-circuits before
      # the (correctly stubbed) command-building logic ever runs, so the
      # specs that assert on it fail with no code defect behind them.
      - name: Install ripgrep
        run: |
          # `rg` is a real dependency of these specs, not a convenience -- they
          # shell out to it. The install is the one step that has to differ per
          # runner image; everything after it is identical on all three. The
          # `rg --version` at the end is the actual gate: if a package manager
          # silently no-ops, the suite must not start and then fail obscurely.
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)   brew install ripgrep || true ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version

      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      - name: Run the spec suite (testing.nvim)
        working-directory: insights.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      - name: Conformance gate
        working-directory: insights.nvim
        run: bash scripts/test.sh conformance
      # The IR of the Linux run carries the surface the specs exercised: the baseline (surface.baseline.json) is
      # written from exactly this artifact, so it matches what the runner measures.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: surface-ir
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 7
      # Regression gate for the surface (docs/SURFACE.md of testing.nvim): a command, keymap or autocommand that the specs
      # exercised when surface.baseline.json was written must still be exercised. Linux only: the baseline comes from
      # the Linux run. To accept an intended change, rewrite the file from a green Linux run (`scripts/test.sh surface
      # --from <ir> --write-baseline surface.baseline.json`, IR = the surface-ir artifact) and review the diff.
      - name: Surface baseline gate
        if: matrix.os == 'ubuntu-latest'
        working-directory: insights.nvim
        run: bash scripts/test.sh surface --from "$RUNNER_TEMP/testing-ir.json" --baseline surface.baseline.json --require-signed-baseline
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
